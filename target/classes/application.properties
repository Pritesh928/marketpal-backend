# === database config ===
spring.datasource.url = jdbc:mysql://localhost:3306/marketpaldb
# ${DB_URL} use in production
spring.datasource.username = root
# ${DB_USERNAME} use in production
spring.datasource.password = Pritesh@12
# ${DB_PASSWORD} use in production
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === jpa config ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# === jwt config ===
jwt.secret=${JWT_SECRET}    
jwt.expiration=86400000

# redis config
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# === email service config ===
resend.api.key=${RESEND_API_KEY}
resend.from.email=noreply@yourdomain.com

# === frontend url (for email verification) ===
app.frontend.url=${FRONTEND_URL}

# === Server Port ===
server.port=8080

# === CORS / Logging (Optional) ===
spring.mvc.cors.allowed-origins=http://localhost:3000,https://marketpalstore.priteshsingh928.qzz.io/    