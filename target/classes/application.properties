# === database config ===
spring.datasource.url=jdbc:mysql://localhost:3306/marketpaldb
spring.datasource.username=root
spring.datasource.password=Pritesh@12   
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === jpa config ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === jwt config ===
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# redis config
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# servlet config 
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# fix tiDB connection dropping
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# security debug logging
logging.level.org.springframework.security=DEBUG

# frontend url the actual address where frontend will serve
app.frontend.url=${FRONTEND_URL}

# server port on which the backend will be running
server.port=8080